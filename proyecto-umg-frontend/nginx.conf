server {
    listen 80;
    server_name localhost;

    # Compresion Gzip para reducir ancho de banda
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Evita que index.html quede en cache para que los deploys se vean al instante
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache inmutable para assets con hash generados por Vite (js, css, imagenes)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}