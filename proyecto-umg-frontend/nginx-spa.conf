server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(?:css|js|jpg|svg|gif|png|ico|woff2?|eot|ttf|otf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}